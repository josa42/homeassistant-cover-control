
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    # Every evaluation logs the intent and the reason behind it.
    custom_components.cover_control: debug

# --- Development fixtures ---------------------------------------------------
#
# Dummy covers and fake inputs so the integration can be exercised without a
# real house and without waiting for the right weather. Everything the engine
# reads is backed by a helper you can drag in the UI:
#
#   input_number.dev_outdoor_temperature  -> sensor.dev_outdoor_temperature
#   input_number.dev_pv_power             -> sensor.dev_pv_power
#   input_boolean.dev_*_window            -> the window contacts
#
# The one input you cannot fake is the sun. To make a cover shade right now,
# set its configured orientation to the sun's current azimuth, which
# sun.sun reports as an attribute.

input_number:
  dev_raffstore_position:
    name: Dev Raffstore position
    min: 0
    max: 100
    step: 1
    initial: 100
    unit_of_measurement: "%"
  dev_raffstore_tilt:
    name: Dev Raffstore tilt
    min: 0
    max: 100
    step: 1
    initial: 100
    unit_of_measurement: "%"
  dev_rolladen_position:
    name: Dev Rolladen position
    min: 0
    max: 100
    step: 1
    initial: 100
    unit_of_measurement: "%"
  dev_outdoor_temperature:
    name: Dev outdoor temperature
    min: -20
    max: 45
    step: 0.5
    initial: 28
    unit_of_measurement: "°C"
  dev_pv_power:
    name: Dev PV power
    min: 0
    max: 12000
    step: 50
    initial: 1500
    unit_of_measurement: "W"
  dev_indoor_temperature:
    name: Dev indoor temperature
    min: 0
    max: 40
    step: 0.5
    initial: 25
    unit_of_measurement: "°C"

input_boolean:
  dev_raffstore_window:
    name: Dev Raffstore window open
  dev_rolladen_window:
    name: Dev Rolladen window open

template:
  - sensor:
      - name: Dev outdoor temperature
        unique_id: dev_outdoor_temperature
        state: "{{ states('input_number.dev_outdoor_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Dev indoor temperature
        unique_id: dev_indoor_temperature
        state: "{{ states('input_number.dev_indoor_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Dev PV power
        unique_id: dev_pv_power
        state: "{{ states('input_number.dev_pv_power') }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

  - binary_sensor:
      - name: Dev Raffstore window
        unique_id: dev_raffstore_window
        device_class: window
        state: "{{ is_state('input_boolean.dev_raffstore_window', 'on') }}"
      - name: Dev Rolladen window
        unique_id: dev_rolladen_window
        device_class: window
        state: "{{ is_state('input_boolean.dev_rolladen_window', 'on') }}"

  - cover:
      # An external venetian blind: reports a position and a slat angle, so it
      # exercises the tilt path and is pre-selected as a Raffstore.
      - name: Dev Raffstore
        unique_id: dev_raffstore
        device_class: shutter
        position: "{{ states('input_number.dev_raffstore_position') | int(0) }}"
        tilt: "{{ states('input_number.dev_raffstore_tilt') | int(0) }}"
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_raffstore_position
            data:
              value: "{{ position }}"
        set_cover_tilt_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_raffstore_tilt
            data:
              value: "{{ tilt }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_raffstore_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_raffstore_position
            data:
              value: 0

      # A roller shutter: position only, no tilt, pre-selected as a Rolladen.
      - name: Dev Rolladen
        unique_id: dev_rolladen
        device_class: shutter
        position: "{{ states('input_number.dev_rolladen_position') | int(0) }}"
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_rolladen_position
            data:
              value: "{{ position }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_rolladen_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.dev_rolladen_position
            data:
              value: 0
